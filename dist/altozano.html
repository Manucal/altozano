<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: el campo de batalla manda (columna ancha), panel de mando a la derecha; en móvil se apila. Estética única, oscura, de mesa de guerra. */
:root{
  --bg:#16121c; --panel:#211b29; --panel-2:#2b2336; --line:#3b3048;
  --ink:#f1e7d6; --muted:#a597b3; --gold:#e9b64a; --gold-ink:#2a1d05;
  --p1:#4aa3ff; --p2:#ff6a4f; --good:#7ddc7a; --bad:#ff7a6a;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1320px;margin:0 auto 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;letter-spacing:.02em;color:var(--gold)}
.brand span{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.fieldtag{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:3px;background:var(--panel);white-space:nowrap}
.chip b{font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;max-width:1320px;margin:0 auto;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;display:flex;flex-direction:column;gap:8px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-family:var(--f-display);font-size:14px;min-height:26px}
.hud .side{display:flex;flex-direction:column;gap:3px}
.hud .side.r{text-align:right}
.bar{height:8px;background:var(--panel-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--p1);transition:width .2s}
.hud .r .bar i{left:auto;right:0;background:var(--p2)}
.hud .clock{font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.canvas-wrap{position:relative;border:2px solid var(--line);background:#0c0a10;line-height:0}
canvas#cv{width:100%;height:auto;aspect-ratio:480/288;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
.tileinfo{font-size:14px;color:var(--muted);min-height:40px}
.tileinfo b{color:var(--ink)}
.tileinfo.warn{color:var(--bad)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.72);line-height:1.4;padding:12px}
.overlay[hidden]{display:none}
.overlay .box{background:var(--panel);border:2px solid var(--gold);padding:18px 20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.overlay h2{font-family:var(--f-display);font-size:26px;margin:0;color:var(--gold);text-wrap:balance}
.overlay p{margin:0}
.res-table{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-variant-numeric:tabular-nums;font-size:14px}
.res-table .h{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-family:var(--f-display);font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.sec h3{margin:0;font-size:18px;font-family:var(--f-display);font-weight:700}
.seg{display:flex;gap:0;border:1px solid var(--line);flex-wrap:wrap}
.seg button{flex:1 1 auto;background:transparent;border:0;padding:7px 10px;border-right:1px solid var(--line);min-width:0}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:600}
select{font:inherit;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);padding:6px 8px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 auto}
.btn{background:var(--panel-2);border:1px solid var(--line);padding:8px 12px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-family:var(--f-display);font-weight:700;font-size:17px;padding:10px 14px}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.legend{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:14px}
.sw{width:18px;height:18px;border:1px solid #000;image-rendering:pixelated;margin-top:2px}
.muted{color:var(--muted)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums;font-size:14px}
.meter .bar{height:10px}
.meter .bar i{background:var(--gold)}
.meter .bar.over i{background:var(--bad)}
.cards{display:grid;grid-template-columns:1fr;gap:6px}
.card{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);padding:6px 8px}
.card img{width:48px;height:48px;image-rendering:pixelated}
.card[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.card .nm{font-weight:600;font-size:15px}
.card .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .ds{font-size:12px}
.cost{font-family:var(--f-display);font-size:18px;color:var(--gold);min-width:28px;text-align:center}
.cost small{display:block;font-size:10px;color:var(--muted);font-family:var(--f-body);letter-spacing:.05em}
.trs{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tr{font-size:11px;padding:0 5px;border:1px solid var(--line);border-radius:2px;color:var(--ink)}
.syn{display:flex;flex-direction:column;gap:4px;font-size:13px}
.syn div{display:grid;grid-template-columns:96px 34px 1fr;gap:6px;align-items:baseline}
.syn .on{color:var(--good)}
.syn .off{color:var(--muted)}
.pip{font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;display:inline-block}
.dot.p1{background:var(--p1)} .dot.p2{background:var(--p2)}
.note{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<header class="top">
  <div class="brand"><h1>Altozano</h1><span>prototipo 0.1</span></div>

    <div class="tileinfo" id="tileinfo">Pasa el cursor por el mapa para ver qué hace cada terreno.</div>
  </section>
  <aside class="panel" id="panel"></aside>
</main>

 for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
  if(op(i,j)){x.fillStyle=white?'#ffffff':(pal[g[j][i]]||'#ff00ff');x.fillRect(i+1,j+1,1,1)}

 }

 if(!white){const id=x.getImageData(0,0,w+2,h+2),d=id.data;for(let j=0;j<h+2;j++){let seen=0;for(let i=0;i<w+2;i++){const k=(j*(w+2)+i)*4;if(d[k+3]&&!(d[k]===18&&d[k+1]===12&&d[k+2]===20)){if(seen<1){d[k]=Math.min(255,d[k]+28);d[k+1]=Math.min(255,d[k+1]+28);d[k+2]=Math.min(255,d[k+2]+22)}seen++}}}x.putImageData(id,0,0)}

function genMap(preset,seed){
 const r=rng(seed),m=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 const blob=(type,cx,cy,rad)=>{for(let y=0;y<ROWS;y++)for(let x=0;x<15;x++){const dx=x+0.5-cx,dy=(y+0.5-cy)*1.15;if(Math.hypot(dx,dy)<=rad+(r()-0.5)*0.9)m[y][x]=type}};
 const R=(a,b)=>a+r()*(b-a);
 let river=false;
 if(preset==='gemelas'){blob(1,R(2.5,4),R(5,13),R(2.4,3));if(r()<0.7)blob(1,R(9,11),r()<0.5?R(2,4):R(14,16),R(1.4,2));blob(2,R(11,13.5),R(4,14),R(1.6,2.4))}
 else if(preset==='vado'){river=true;blob(1,R(3,6),R(3,6),R(1.6,2.2));blob(1,R(3,6),R(12,15),R(1.4,2));blob(2,R(8,11),R(7,11),R(1.5,2.2))}
 else if(preset==='bosque'){for(let i=0;i<4;i++)blob(2,R(12,15),R(1,17),R(1.8,2.6));blob(1,R(4,7),R(2,5),R(1.8,2.3));blob(1,R(4,7),R(13,16),R(1.8,2.3))}
 else if(preset==='meseta'){blob(1,15,R(7.5,10.5),R(3.4,4.2));blob(2,R(5,8),R(1,4),R(1.4,2));blob(2,R(5,8),R(14,17),R(1.4,2))}
 else{const nh=1+(r()*3|0),nf=1+(r()*3|0);for(let i=0;i<nh;i++)blob(1,R(1,14),R(1,17),R(1.4,3));for(let i=0;i<nf;i++)blob(2,R(5,15),R(1,17),R(1.3,2.6));river=r()<0.4}
 if(river){let w=0;for(let y=0;y<ROWS;y++){if(r()<0.25)w=1-w;m[y][14]=3;if(w)m[y][13]=3;else if(m[y][13]===3)m[y][13]=0}}
 for(let y=0;y<ROWS;y++)for(let x=0;x<15;x++)m[y][COLS-1-x]=m[y][x];
 return m;
}

}

 const tint=wid==='snow'?[[236,242,250],0.3]:wid==='rain'?[[30,45,80],0.2]:wid==='heat'?[[235,190,90],0.14]:wid==='fog'?[[150,160,170],0.12]:null;
 const put=(px,py,rgb,mul=1)=>{let a=rgb[0]*mul,b=rgb[1]*mul,c=rgb[2]*mul;if(tint){const[t,k]=tint;a=a*(1-k)+t[0]*k;b=b*(1-k)+t[1]*k;c=c*(1-k)+t[2]*k}const i=(py*W+px)*4;d[i]=a;d[i+1]=b;d[i+2]=c;d[i+3]=255};
 const isT=(c,rr,t)=>c>=0&&c<COLS&&rr>=0&&rr<ROWS&&m[rr][c]===t;
 const CL=['#7a5a38','#6a4c2e','#5c4027'].map(hex),HI=hex('#c4dc78'),SAND=hex('#c9b27a'),DARKG=hex('#3c6e2c');
 const FL=['#e8d36a','#e88aa0','#f0f0f0'].map(hex);
 for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
  const t=m[ty][tx],cols=TER[t].col.map(hex);

   }

   }

function buildTrees(){

/* ================= EJÉRCITO AUTOMÁTICO / IA ================= */
function zoneTiles(side){const o=[];for(let r=0;r<ROWS;r++)for(let c=0;c<ZONE;c++)o.push({c:side?COLS-ZONE+c:c,r});return o}
const inZone=(t,side)=>t&&(side===0?t.c<ZONE:t.c>=COLS-ZONE);
function autoArmy(side,fi){
 const pool=UNITS.filter(u=>u.f===fi),r=Math.random;
 const role=u=>u.heal?'heal':u.fly?'fly':u.rng>1?'ranged':u.big?'big':u.charge?'mount':'melee';
 const by={};pool.forEach(u=>(by[role(u)]=by[role(u)]||[]).push(u));
 const zone=zoneTiles(side),m=S.map,wid=S.weather.id;
 const hills=zone.filter(t=>m[t.r][t.c]===1);
 const wf=wid==='windE'?(side===0?1:-1):wid==='windW'?(side===1?1:-1):0;
 const wts={ranged:0.36+(hills.length>=6?0.16:0)+(wid==='fog'||wid==='rain'?-0.16:0)+wf*0.1,heal:0.1,melee:0.3,big:0.12,mount:wid==='snow'?0.03:0.12,fly:0.08};
 let cap=CAP;const picks=[];const minC=Math.min(...pool.map(p=>p.cost));
 for(let tries=0;tries<500&&picks.length<MAXU&&cap>=minC;tries++){
  const roles=Object.keys(wts).filter(k=>by[k]);const tot=roles.reduce((a,k)=>a+wts[k],0);let x=r()*tot,k=roles[0];
  for(const kk of roles){x-=wts[kk];if(x<=0){k=kk;break}}
  if(k==='heal'&&picks.filter(p=>p.heal).length>=3)continue;
  const u=by[k][(r()*by[k].length)|0];if(u.cost<=cap){picks.push(u);cap-=u.cost}
 }
 const occ=new Set(),units=[],mid=(ROWS-1)/2;
 const depth=t=>side===0?ZONE-1-t.c:t.c-(COLS-ZONE);
 const sil=u=>u.tr.includes('Silvano');
 const key={
  ranged:(t,u)=>m[t.r][t.c]===1?depth(t)*0.2+r()*0.3:(sil(u)&&m[t.r][t.c]===2)?5+depth(t)*0.2+r()*0.3:10-depth(t)+Math.abs(t.r-mid)*0.05+r()*0.6,
  big:t=>depth(t)+Math.abs(t.r-mid)*0.1+r()*0.5,
  melee:t=>depth(t)+Math.abs(t.r-mid)*0.06+r()*0.8,
  mount:t=>depth(t)*0.6-Math.abs(t.r-mid)*0.3+r()*0.6,
  heal:t=>Math.abs(depth(t)-3.5)+Math.abs(t.r-mid)*0.1+r()*0.5,
  fly:t=>Math.abs(depth(t)-4)+r(),
 };
 for(const k of ['ranged','big','melee','mount','heal','fly']){
  for(const u of picks.filter(p=>role(p)===k)){
   const cands=sortBy(zone,t=>key[k](t,u));
   for(const t of cands){const kk=t.c+','+t.r;if(!occ.has(kk)){occ.add(kk);units.push({id:u.id,c:t.c,r:t.r});break}}
  }
 }
 return {fac:fi,units};
}

function aiArmy(){
 const f=(Math.random()*FACTIONS.length)|0;if(Math.random()>0.35)return autoArmy(1,f);
 const g=(f+1+((Math.random()*(FACTIONS.length-1))|0))%FACTIONS.length;
 const A=autoArmy(1,f),B=autoArmy(1,g);const occ=new Set(),units=[];let cost=0;
 const all=sortBy([...A.units,...B.units],()=>Math.random());
 for(const u of all){const k=u.c+','+u.r,c=UBY[u.id].cost;if(occ.has(k)||cost+c>CAP||units.length>=MAXU)continue;occ.add(k);units.push(u);cost+=c}

}

function startBattle(){

 S.stats=[{dmg:0,kills:0,byType:{}},{dmg:0,kills:0,byType:{}}];
 for(const side of [0,1]){
  const a=S.armies[side];S.syn[side]=computeSyn(a.units);
  for(const it of a.units){const def=UBY[it.id];S.units.push({def,side,x:it.c+0.5,y:it.r+0.5,hp:def.hp,max:def.hp,cd:0.3+Math.random()*0.6,tgt:null,ret:0,moved:0,anim:Math.random()*2,lunge:0,flash:0,alive:true,hold:false,dest:null,face:side?-1:1,moving:false,rad:def.big?0.55:def.mount?0.45:0.36,mass:def.big?3:def.mount?2:1})}
 }
 for(const u of S.units)if(u.def.rng>1&&!u.def.heal&&terrAt(u)===1)u.hold=true;
 S.total=[0,1].map(s=>S.units.filter(u=>u.side===s).reduce((a,u)=>a+u.def.cost,0));
 S.state='battle';S.lastPanel=0;renderPanel();
}
const elev=u=>(!u.def.fly&&terrAt(u)===1)?1:0;
function effRange(u,tg){
 let rg=u.def.rng;if(rg<=1)return rg;
 const hill=elev(u)===1,wid=S.weather.id;
 if(wid==='fog')rg=Math.min(rg,4)+(hill?1:0);else if(hill)rg+=2;
 if(tg&&(wid==='windE'||wid==='windW')&&!u.def.heal){const dir=Math.sign(tg.x-u.x),fav=wid==='windE'?1:-1;rg+=dir===fav?2:-2}
 return Math.max(2,rg);
}
function speedOf(u){
 let s=u.def.spd;const t=terrAt(u),wid=S.weather.id;
 if(!u.def.fly){
  if(t===1)s*=TER[1].mv;
  else if(t===2&&!u.def.tr.includes('Silvano'))s*=TER[2].mv;
  else if(t===3)s*=wid==='rain'?0.3:wid==='heat'?0.8:TER[3].mv;
 }
 if(wid==='snow'&&!u.def.tr.includes('Bestia'))s*=0.7;
 if(u.def.tr.includes('Montado')&&tier(u.side,'Montado')>=1)s*=1.2;
 return s;
}
function cool(u){let c=u.def.as;if(S.weather.id==='heat'&&u.def.arm>=4)c*=1.25;if(u.def.fly){const t=tier(u.side,'Volador');c/=t===2?1.5:t===1?1.25:1}return c*(0.92+Math.random()*0.16)}
function pickTarget(u){
 let best=null,bd=1e9;const ranged=u.def.fly;
 for(const e of S.units){if(!e.alive||e.side===u.side)continue;let d=dist(u,e);if(ranged&&e.def.rng>1)d*=0.45;if(d<bd){bd=d;best=e}}

}
function pickHeal(u){let best=null,br=0.92;for(const a of S.units){if(!a.alive||a.side!==u.side||a===u)continue;const r=a.hp/a.max;if(r<br&&dist(u,a)<8){br=r;best=a}}return best}
function seekHill(u){
 if(elev(u)||u.def.fly||!u.tgt)return;
 if(u.dest&&S.claims.has(u.dest.k))return;
 const dT=dist(u,u.tgt);let best=null,bd=1e9;
 const c0=Math.floor(u.x),r0=Math.floor(u.y);
 for(let r=r0-5;r<=r0+5;r++)for(let c=c0-5;c<=c0+5;c++){
  if(r<0||c<0||r>=ROWS||c>=COLS||S.map[r][c]!==1)continue;const k=c+','+r;if(S.claims.has(k))continue;
  const p={x:c+0.5,y:r+0.5};const d=dist(u,p);if(d>5)continue;if(dist(p,u.tgt)>dT+1)continue;if(d<bd){bd=d;best={x:p.x,y:p.y,k}}

function moveTo(u,tx,ty,dt,stop){

function attack(u,tg){
 let base=u.def.atk;const ranged=u.def.rng>1,wid=S.weather.id;
 if(ranged){const t=tier(u.side,'Tirador');base*=t===2?1.3:t===1?1.15:1}
 if(u.def.tr.includes('Bestia')){const t=tier(u.side,'Bestia');base*=t===2?1.3:t===1?1.15:1}
 if(u.def.tr.includes('Silvano')){if(terrAt(u)===2){const t=tier(u.side,'Silvano');base*=t===2?1.4:t===1?1.25:1}if(wid==='fog')base*=1.2}
 const eu=elev(u),et=elev(tg);
 if(ranged&&eu>et)base*=1.25;
 if(!ranged&&!u.def.fly&&eu<et)base*=0.8;
 if(u.def.anti&&tg.def.tr.includes(u.def.anti))base*=2;
 if(u.def.charge&&u.moved>=3&&wid!=='snow'){base*=tier(u.side,'Montado')>=2?2.5:2;burst(tg.x*T,tg.y*T,'#ffe066',8)}
 u.moved=0;
 if(ranged){S.proj.push({x0:u.x*T,y0:(u.y*T)-6-(eu?3:0),t:0,dur:Math.max(0.15,dist(u,tg)/11),kind:u.def.proj,tgt:tg,att:u,base,lx:u.x*T,ly:u.y*T,col:u.def.sp.pal&&u.def.sp.pal.y})}
 else{u.lunge=0.15;deal(u,tg,base,false);if(u.def.splash){const t=tier(u.side,'Gigante'),f=t===2?1:t===1?0.75:0.5;for(const e of S.units)if(e.alive&&e.side!==u.side&&e!==tg&&dist(e,tg)<1.15)deal(u,e,base*f,false);burst(tg.x*T,tg.y*T,'#c9b27a',6)}}
}
function deal(att,tg,base,ranged){
 if(!tg.alive)return;
 let d=base;const wid=S.weather.id;
 if(ranged){
  if(!tg.def.fly&&terrAt(tg)===2)d*=0.6;
  if(tg.def.tr.includes('Escudo')){const t=tier(tg.side,'Escudo');d*=t===2?0.55:t===1?0.75:1}
  if(wid==='rain')d*=0.75;
 }
 if(tg.def.dodge&&Math.random()<tg.def.dodge){burst(tg.x*T,tg.y*T-8,'#ffffff',2);return}
 let arm=tg.def.arm;if(tg.def.tr.includes('Infanteria')){const t=tier(tg.side,'Infanteria');arm+=t===2?4:t===1?2:0}
 if(!tg.def.fly&&terrAt(tg)===3)arm-=3;
 if(att.def.pierce)arm=0;
 d=Math.max(1,d-Math.max(0,arm));
 tg.hp-=d;tg.flash=0.1;
 const st=S.stats[att.side];st.dmg+=d;st.byType[att.def.id]=(st.byType[att.def.id]||0)+d;
 if(tg.hp<=0){tg.alive=false;st.kills++;S.corpses.push({x:tg.x,y:tg.y,def:tg.def,face:tg.face,el:elev(tg),t:0});burst(tg.x*T,tg.y*T-4,'#b23a2a',10);if(tg.dest)S.claims.delete(tg.dest.k)}
}
function doHeal(u,ally){
 let a=u.def.heal;const t=tier(u.side,'Mistico');a*=t===2?1.6:t===1?1.3:1;if(S.weather.id==='rain')a*=1.2;
 S.proj.push({x0:u.x*T,y0:u.y*T-8,t:0,dur:Math.max(0.2,dist(u,ally)/8),kind:'heal',tgt:ally,att:u,base:a});
}
function burst(x,y,col,n){for(let i=0;i<n;i++)S.parts.push({x,y,vx:(Math.random()-0.5)*60,vy:-Math.random()*50-10,life:0.4+Math.random()*0.4,col})}
function step(dt){
 S.time+=dt;
 const alive=S.units.filter(u=>u.alive);
 for(let i=alive.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=alive[i];alive[i]=alive[j];alive[j]=t}
 for(const u of alive){
  if(!u.alive)continue;
  u.flash=Math.max(0,u.flash-dt);u.lunge=Math.max(0,u.lunge-dt);u.cd-=dt;u.ret-=dt;
  if(u.def.tr.includes('Silvano')){const t=tier(u.side,'Silvano');if((t>=1&&terrAt(u)===2)||t>=2)u.hp=Math.min(u.max,u.hp+3*dt)}
  if(u.ret<=0||!u.tgt||!u.tgt.alive){u.tgt=pickTarget(u);u.ret=0.4+Math.random()*0.2;if(u.def.rng>1&&!u.def.heal&&!u.hold)seekHill(u)}
  if(u.def.heal){
   const ally=pickHeal(u);
   if(ally){const d=dist(u,ally),hr=effRange(u,null);if(d<=hr){u.moving=false;u.face=Math.sign(ally.x-u.x)||u.face;if(u.cd<=0){doHeal(u,ally);u.cd=cool(u)}continue}else if(d<8){moveTo(u,ally.x,ally.y,dt,hr*0.8);continue}}
  }
  const tg=u.tgt;if(!tg){u.moving=false;continue}
  const d=dist(u,tg),rg=effRange(u,tg);
  const reach=u.def.rng<=1?0.78+(tg.def.big?0.22:0)+(u.def.big?0.22:0):rg;
  if(d<=reach){u.idle=0;u.moving=false;u.face=Math.sign(tg.x-u.x)||u.face;if(u.cd<=0){attack(u,tg);u.cd=cool(u)}}
  else{
   if(u.hold){u.idle=(u.idle||0)+dt;if((S.time>20&&d>rg+6)||u.idle>6)u.hold=false;else{u.moving=false;u.face=Math.sign(tg.x-u.x)||u.face;continue}}
   if(u.dest){moveTo(u,u.dest.x,u.dest.y,dt,0.05);if(dist(u,u.dest)<0.2){S.claims.delete(u.dest.k);u.dest=null;if(elev(u))u.hold=true}}
   else moveTo(u,tg.x,tg.y,dt,reach*0.9);
  }
 }
 // separación
 const al=S.units.filter(u=>u.alive);
 for(let i=0;i<al.length;i++){const a=al[i];for(let j=i+1;j<al.length;j++){const b=al[j];if(!!a.def.fly!==!!b.def.fly)continue;const dx=b.x-a.x,dy=b.y-a.y,rr=a.rad+b.rad,d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>1e-6){const d=Math.sqrt(d2),p=(rr-d),nx=dx/d,ny=dy/d,tm=a.mass+b.mass;const fa=(a.hold?0.15:1)*b.mass/tm,fb=(b.hold?0.15:1)*a.mass/tm;a.x-=nx*p*fa;a.y-=ny*p*fa;b.x+=nx*p*fb;b.y+=ny*p*fb}}}
 for(const u of al){u.x=clamp(u.x,0.3,COLS-0.3);u.y=clamp(u.y,0.3,ROWS-0.3)}
 // proyectiles
 for(const p of S.proj){p.t+=dt;if(p.t>=p.dur){p.done=true;if(p.tgt.alive){if(p.kind==='heal'){p.tgt.hp=Math.min(p.tgt.max,p.tgt.hp+p.base);for(let i=0;i<4;i++)S.parts.push({x:p.tgt.x*T+(Math.random()-0.5)*8,y:p.tgt.y*T-6,vx:0,vy:-20,life:0.5,col:'#7dff8a'})}else deal(p.att,p.tgt,p.base,true)}}}
 S.proj=S.proj.filter(p=>!p.done);
 for(const c of S.corpses)c.t+=dt;
 const n0=al.filter(u=>u.side===0).length,n1=al.filter(u=>u.side===1).length;
 if(n0===0||n1===0||S.time>=TLIM)endBattle(n0,n1);
}
function valueLeft(side){return S.units.filter(u=>u.alive&&u.side===side).reduce((a,u)=>a+u.def.cost*u.hp/u.max,0)}
function endBattle(n0,n1){
 let win;if(n0===0&&n1===0)win=-1;else if(n1===0)win=0;else if(n0===0)win=1;else{const v0=valueLeft(0),v1=valueLeft(1);win=Math.abs(v0-v1)<0.5?-1:v0>v1?0:1}

}

 if(fly){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(Math.round(px)-3,Math.round(py),7,2);shadow(Math.round(px),Math.round(py)+1,col,false);py-=10+Math.sin((opts.t||0)*6+x)*1.5}

 const face=opts.face!==undefined?opts.face:(side?-1:1);

 drawSprite(img,dx,dy,face<0);
 if(opts.flash>0){ctx.globalAlpha=0.75;drawSprite(s.w[fr],dx,dy,face<0);ctx.globalAlpha=1}
 if(opts.hp!==undefined&&opts.hp<1){const bw=def.big?14:10,bx=Math.round(px-bw/2),by=Math.round(dy)-3;ctx.fillStyle='#120c14';ctx.fillRect(bx-1,by-1,bw+2,4);ctx.fillStyle='#3a2a2a';ctx.fillRect(bx,by,bw,2);ctx.fillStyle=side?'#ff6a4f':'#4aa3ff';ctx.fillRect(bx,by,Math.max(1,Math.round(bw*opts.hp)),2)}

   <div class="meter"><span>Unidades</span><div class="bar"><i style="width:${n/MAXU*100}%"></i></div><b>${n}/${MAXU}</b></div>
  </div>
  <div class="sec"><h2>Tropas</h2><div class="cards">${fu.map(u=>`<button class="card" data-u="${u.id}" aria-pressed="${S.sel===u.id}">
   <img alt="" src="${ICON[u.id]}"><span><span class="nm">${esc(u.name)}</span>
   <span class="st"> · Vida ${u.hp} · Ataque ${u.atk}${u.heal?' · Cura '+u.heal:''} · Alcance ${u.rng} · Armadura ${u.arm}</span>
   <span class="trs">${u.tr.map(t=>`<span class="tr">${TRAITS[t].n}</span>`).join('')}</span><span class="ds">${esc(u.desc)}</span></span>
   <span class="cost">${u.cost}<small>cap.</small></span></button>`).join('')}</div></div>
  <div class="sec"><h2>Sinergias</h2>${synHTML(a.units,fac)}</div>
  <div class="row"><button class="btn" id="b-auto">Desplegar automático</button><button class="btn" id="b-clear">Vaciar</button></div>
  <div class="row"><button class="btn" id="b-back">Volver al campo</button><button class="btn primary" id="b-ready" ${n?'':'disabled'}>${S.mode==='pvp'&&S.side===0?'Listo, turno del J2':'¡A la batalla!'}</button></div>`;
  P.querySelectorAll('[data-fac]').forEach(b=>b.onclick=()=>{const i=+b.dataset.fac;if(i===a.fac)return;a.fac=i;S.sel=null;renderPanel()});
  P.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.u;P.querySelectorAll('[data-u]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.u===S.sel))});
  $('b-auto').onclick=()=>{S.armies[S.side]=autoArmy(S.side,a.fac);renderPanel()};
  $('b-clear').onclick=()=>{a.units=[];renderPanel()};
  $('b-back').onclick=()=>{S.state='setup';renderPanel();renderHud()};
  $('b-ready').onclick=ready;
 }
 else if(S.state==='battle'||S.state==='result'){
  P.innerHTML=`
  <div class="sec"><h2>Velocidad</h2><div class="seg" role="group">${[1,2,4].map(s=>`<button data-sp="${s}" aria-pressed="${S.speed===s}">x${s}</button>`).join('')}</div></div>
  ${[0,1].map(side=>`<div class="sec"><div class="who"><span class="dot ${side?'p2':'p1'}"></span><h3>${playerLabel(side)} · ${esc(armyFacName(S.armies[side]))}</h3></div>${synHTML(S.armies[side].units,null)}</div>`).join('')}
  <button class="btn" id="b-end">${S.state==='battle'?'Terminar ya (gana quien tenga más valor vivo)':'Ver resultado'}</button>`;
  P.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.sp;P.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.sp===S.speed))});
  $('b-end').onclick=()=>{if(S.state==='battle'){S.time=TLIM;const al=S.units.filter(u=>u.alive);endBattle(al.filter(u=>!u.side).length,al.filter(u=>u.side).length)}else showResult()};
 }
}
function ready(){
 if(S.mode==='pvp'&&S.side===0){S.state='handoff';S.sel=null;showOverlay(`<h2>Turno del Jugador 2</h2><p>Pásale el dispositivo. El ejército del Jugador 1 queda oculto hasta la batalla.</p><button class="btn primary" id="ov-go">Soy el Jugador 2</button>`);$('ov-go').onclick=()=>{hideOverlay();S.side=1;S.state='deploy';renderPanel();renderHud()};return}
 if(S.mode==='ai')S.armies[1]=aiArmy();
 hideOverlay();startBattle();renderHud();
}
function showOverlay(html){const o=$('overlay');o.innerHTML=`<div class="box">${html}</div>`;o.hidden=false}
function hideOverlay(){$('overlay').hidden=true}
function showResult(){
 const R_=S.result;const lbl=s=>playerLabel(s);
 let title=R_.win===-1?'Empate':S.mode==='ai'?(R_.win===0?'Victoria':'Derrota'):`Gana ${lbl(R_.win)}`;
 const best=s=>{const b=S.stats[s].byType;const k=Object.keys(b).sort((x,y)=>b[y]-b[x])[0];return k?UBY[k].name:'—'};
 showOverlay(`<h2>${title}</h2>${R_.timeout?'<p class="muted">Se acabó el tiempo: gana quien conserva más valor de ejército.</p>':''}
 <div class="res-table"><span class="h"></span><span class="h">${esc(lbl(0))}</span><span class="h">${esc(lbl(1))}</span>
 <span>Supervivientes</span><b>${R_.n[0]}/${S.armies[0].units.length}</b><b>${R_.n[1]}/${S.armies[1].units.length}</b>
 <span>Daño causado</span><b>${Math.round(S.stats[0].dmg)}</b><b>${Math.round(S.stats[1].dmg)}</b>
 <span>Bajas causadas</span><b>${S.stats[0].kills}</b><b>${S.stats[1].kills}</b>
 <span>Tropa más dañina</span><b>${esc(best(0))}</b><b>${esc(best(1))}</b></div>
 <div class="row"><button class="btn primary" id="ov-re">Revancha</button></div>
 <div class="row"><button class="btn" id="ov-army">Cambiar ejército</button><button class="btn" id="ov-new">Nuevo campo</button></div>
 <button class="btn" id="ov-look">Ver el campo</button>`);
 $('ov-re').onclick=()=>{hideOverlay();if(S.mode==='ai'){const f=S.armies[1].fac;S.armies[1]=autoArmy(1,f)}startBattle();renderHud()};
 $('ov-army').onclick=()=>{hideOverlay();S.units=[];S.corpses=[];S.proj=[];S.side=0;S.state='deploy';renderPanel();renderHud()};
 $('ov-new').onclick=()=>{hideOverlay();S.units=[];S.corpses=[];S.proj=[];S.state='setup';newField();renderPanel();renderHud()};
 $('ov-look').onclick=()=>hideOverlay();
}
function renderHud(){
 const h=$('hud');
 if(S.state==='battle'||S.state==='result'){
  const v=[0,1].map(s=>valueLeft(s)/Math.max(1,S.total[s])*100),n=[0,1].map(s=>S.units.filter(u=>u.alive&&u.side===s).length);
  h.innerHTML=`<div class="side"><span>${esc(playerLabel(0))} · ${n[0]}</span><div class="bar"><i style="width:${v[0]}%"></i></div></div><div class="clock">${Math.max(0,Math.ceil(TLIM-S.time))}s</div><div class="side r"><span>${n[1]} · ${esc(playerLabel(1))}</span><div class="bar"><i style="width:${v[1]}%"></i></div></div>`;
 }else if(S.state==='deploy'){
  h.innerHTML=`<div class="side"><span>${esc(playerLabel(S.side))}: despliega en la franja ${S.side?'roja':'azul'}</span></div><div></div><div></div>`;
 }else h.innerHTML=`<div class="side"><span>Estudia el campo antes de elegir tropas</span></div><div></div><div></div>`;
}
let toastT=0;
function toast(msg){const el=$('tileinfo');el.textContent=msg;el.classList.add('warn');clearTimeout(toastT);toastT=setTimeout(()=>{el.classList.remove('warn');updateTileInfo()},2200)}
function updateTileInfo(){
 const el=$('tileinfo');if(el.classList.contains('warn'))return;const t=S.hover;
 if(!t){el.innerHTML='Pasa el cursor por el mapa para ver qué hace cada terreno.';return}
 const ter=TER[S.map[t.r][t.c]];el.innerHTML=`<b>${ter.n}.</b> ${esc(ter.d)}`;
}
function tileOf(e){const r=cv.getBoundingClientRect();const c=Math.floor((e.clientX-r.left)/r.width*COLS),rr=Math.floor((e.clientY-r.top)/r.height*ROWS);if(c<0||rr<0||c>=COLS||rr>=ROWS)return null;return {c,r:rr}}
let paint=null,lastPaint=null;
function applyPaint(t){
 if(!t||!inZone(t,S.side))return;const k=t.c+','+t.r;if(k===lastPaint)return;lastPaint=k;
 const a=S.armies[S.side],idx=a.units.findIndex(u=>u.c===t.c&&u.r===t.r);
 if(paint==='del'){if(idx>=0){a.units.splice(idx,1);renderPanel()}return}
 if(idx>=0)return;
 if(!S.sel){toast('Primero elige una tropa en el panel.');return}
 const def=UBY[S.sel];
 if(a.units.length>=MAXU){toast('Límite de '+MAXU+' unidades.');return}
 if(armyCost(a)+def.cost>CAP){toast('No queda capacidad: '+def.name+' cuesta '+def.cost+'.');return}
 a.units.push({id:def.id,c:t.c,r:t.r});renderPanel();
}
cv.addEventListener('pointerdown',e=>{
 if(S.state!=='deploy')return;const t=tileOf(e);if(!t)return;
 if(!inZone(t,S.side)){toast('Solo puedes desplegar en tu franja.');return}
 const a=S.armies[S.side];paint=a.units.some(u=>u.c===t.c&&u.r===t.r)?'del':'add';lastPaint=null;applyPaint(t);
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 e.preventDefault();
});
cv.addEventListener('pointermove',e=>{const t=tileOf(e);const ch=!S.hover||!t||t.c!==S.hover.c||t.r!==S.hover.r;S.hover=t;if(ch)updateTileInfo();if(paint)applyPaint(t)});
const endPaint=()=>{paint=null;lastPaint=null};
cv.addEventListener('pointerup',endPaint);cv.addEventListener('pointercancel',endPaint);
cv.addEventListener('pointerleave',()=>{if(!paint){S.hover=null;updateTileInfo()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

'use strict';
/* ================= ARRANQUE ================= */
buildSprites();
for(const u of UNITS)ICON[u.id]=iconURL(u.id);
S.armies[1].fac=1;
newField();renderPanel();renderHud();
requestAnimationFrame(frame);
window.__altozano=S;window.__alt={step,startBattle,autoArmy,newField,FACTIONS};
})();
</script>
