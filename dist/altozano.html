<title>Altozano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: el campo de batalla manda (columna ancha), panel de mando a la derecha; en móvil se apila. Estética única, oscura, de mesa de guerra. */
:root{
  --bg:#16121c; --panel:#211b29; --panel-2:#2b2336; --line:#3b3048;
  --ink:#f1e7d6; --muted:#a597b3; --gold:#e9b64a; --gold-ink:#2a1d05;
  --p1:#4aa3ff; --p2:#ff6a4f; --good:#7ddc7a; --bad:#ff7a6a;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1320px;margin:0 auto 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;letter-spacing:.02em;color:var(--gold)}
.brand span{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.fieldtag{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:3px;background:var(--panel);white-space:nowrap}
.chip b{font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;max-width:1320px;margin:0 auto;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;display:flex;flex-direction:column;gap:8px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-family:var(--f-display);font-size:14px;min-height:26px}
.hud .side{display:flex;flex-direction:column;gap:3px}
.hud .side.r{text-align:right}
.bar{height:8px;background:var(--panel-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--p1);transition:width .2s}
.hud .r .bar i{left:auto;right:0;background:var(--p2)}
.hud .clock{font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.canvas-wrap{position:relative;border:2px solid var(--line);background:#0c0a10;line-height:0}
canvas#cv{width:100%;height:auto;aspect-ratio:704/416;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
.zoombar{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:0;background:rgba(18,12,20,.86);border:1px solid var(--line);line-height:1.2;font-size:13px}
.zoombar button{background:transparent;border:0;border-right:1px solid var(--line);padding:6px 10px;min-width:34px;font-family:var(--f-display);font-size:16px}
.zoombar button:last-child{border-right:0;font-family:var(--f-body);font-size:13px}
.zoombar button:disabled{opacity:.4;cursor:default}
.zoombar span{padding:0 8px;color:var(--muted);font-variant-numeric:tabular-nums;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.tileinfo{font-size:14px;color:var(--muted);min-height:40px}
.tileinfo b{color:var(--ink)}
.tileinfo.warn{color:var(--bad)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.72);line-height:1.4;padding:12px}
.overlay[hidden]{display:none}
.overlay .box{background:var(--panel);border:2px solid var(--gold);padding:18px 20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.overlay h2{font-family:var(--f-display);font-size:26px;margin:0;color:var(--gold);text-wrap:balance}
.overlay p{margin:0}
.res-table{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-variant-numeric:tabular-nums;font-size:14px}
.res-table .h{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-family:var(--f-display);font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.sec h3{margin:0;font-size:18px;font-family:var(--f-display);font-weight:700}
.seg{display:flex;gap:0;border:1px solid var(--line);flex-wrap:wrap}
.seg button{flex:1 1 auto;background:transparent;border:0;padding:7px 10px;border-right:1px solid var(--line);min-width:0}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:600}
select{font:inherit;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);padding:6px 8px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 auto}
.btn{background:var(--panel-2);border:1px solid var(--line);padding:8px 12px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-family:var(--f-display);font-weight:700;font-size:17px;padding:10px 14px}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.legend{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:14px}
.sw{width:18px;height:18px;border:1px solid #000;image-rendering:pixelated;margin-top:2px}
.muted{color:var(--muted)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums;font-size:14px}
.meter .bar{height:10px}
.meter .bar i{background:var(--gold)}
.meter .bar.over i{background:var(--bad)}
.cards{display:grid;grid-template-columns:1fr;gap:6px}
.card{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);padding:6px 8px}
.card img{width:48px;height:48px;image-rendering:pixelated}
.card[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.card.elite{border-color:#6a5326;background:linear-gradient(90deg,#3a2e1c,var(--panel-2) 60%)}
.badge{font-family:var(--f-display);font-size:11px;padding:0 5px;background:var(--gold);color:var(--gold-ink);border-radius:2px;vertical-align:1px}
.card .nm{font-weight:600;font-size:15px}
.card .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .ds{font-size:12px}
.cost{font-family:var(--f-display);font-size:18px;color:var(--gold);min-width:28px;text-align:center}
.cost small{display:block;font-size:10px;color:var(--muted);font-family:var(--f-body);letter-spacing:.05em}
.trs{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tr{font-size:11px;padding:0 5px;border:1px solid var(--line);border-radius:2px;color:var(--ink)}
.syn{display:flex;flex-direction:column;gap:4px;font-size:13px}
.syn div{display:grid;grid-template-columns:96px 34px 1fr;gap:6px;align-items:baseline}
.syn .on{color:var(--good)}
.syn .off{color:var(--muted)}
.pip{font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;display:inline-block}
.dot.p1{background:var(--p1)} .dot.p2{background:var(--p2)}
.note{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

      <div class="overlay" id="overlay" hidden></div>

    <div class="tileinfo" id="tileinfo"></div>

</main>

function raster(g,pal,white){
 const h=g.length,w=g[0].length,c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
 const op=(i,j)=>j>=0&&j<h&&i>=0&&i<w&&g[j][i]!=='.';
 for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
  if(op(i,j)){x.fillStyle=white?'#ffffff':(pal[g[j][i]]||'#ff00ff');x.fillRect(i+1,j+1,1,1)}
  else if(op(i-1,j)||op(i+1,j)||op(i,j-1)||op(i,j+1)){x.fillStyle=white?'#ffffff':'#120c14';x.fillRect(i+1,j+1,1,1)}
 }
 // luz suave arriba-izquierda: aclara el primer píxel opaco de cada fila
 if(!white){const id=x.getImageData(0,0,w+2,h+2),d=id.data;for(let j=0;j<h+2;j++){let seen=0;for(let i=0;i<w+2;i++){const k=(j*(w+2)+i)*4;if(d[k+3]&&!(d[k]===18&&d[k+1]===12&&d[k+2]===20)){if(seen<1){d[k]=Math.min(255,d[k]+28);d[k+1]=Math.min(255,d[k+1]+28);d[k+2]=Math.min(255,d[k+2]+22)}seen++}}}x.putImageData(id,0,0)}
 return c;
}

// ruido suave (value noise + fbm) para que las regiones de bioma tengan formas orgánicas
function vnoise(seed){
 const hs=(i,j)=>{let h=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(seed|0,2246822519);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
 const sm=t=>t*t*(3-2*t);
 const n=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j);const a=hs(i,j),b=hs(i+1,j),c=hs(i,j+1),d=hs(i+1,j+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
 return (x,y)=>(n(x,y)*0.57+n(x*2.03+17.1,y*2.03+5.3)*0.29+n(x*4.1+3.7,y*4.1+29.9)*0.14);
}

 const shape=(side,dv,u,rad,fn)=>{const c=P(side,dv,u),p1=r()*6.28,p2=r()*6.28,a1=R(0.08,0.2),a2=R(0.04,0.12),sx=R(0.8,1.25);

function autoArmy(side,fi){

 const isDef=side===S.def;
 const wts={ranged:0.36+(hills.length>=6?0.16:0)+(wid==='fog'||wid==='rain'?-0.16:0)+wf*0.1,heal:0.1,melee:0.3,big:0.12,mount:wid==='snow'?0.03:isDef?0.07:0.12,fly:0.08};

  const roles=Object.keys(wts).filter(k=>by[k]);const tot=roles.reduce((a,k)=>a+wts[k],0);let x=r()*tot,k=roles[0];

  const u=by[k][(r()*by[k].length)|0];if(u.elite&&picks.filter(p=>p.elite).length>=ELITEMAX)continue;if(u.cost<=cap){picks.push(u);cap-=u.cost}
 }

 const sil=u=>u.tr.includes('Silvano');
 const key={
  ranged:(t,u)=>S.hgt[t.r][t.c]>=1&&m[t.r][t.c]!==4?(2-S.hgt[t.r][t.c])*1.5+depth(t)*0.2+r()*0.3:(sil(u)&&m[t.r][t.c]===2)?5+depth(t)*0.2+r()*0.3:10-depth(t)+fl(t)*0.05+r()*0.6,

  }
 }
 return {fac:fi,units};
}

function deal(att,tg,base,ranged){
 if(!tg.alive)return;
 let d=base;const wid=S.weather.id;
 if(ranged){

 }
 if(tg.def.dodge&&Math.random()<tg.def.dodge){burst(tg.x*T,tg.y*T-8,'#ffffff',2);return}
 if(att.def.sunder)tg.sunderT=S.time+4;
 if(att.def.slow)tg.slowT=S.time+2;
 if(att.def.poison&&!tg.def.tr.includes('NoMuerto')){tg.poison=4;tg.poisonDps=Math.max(tg.poison>0&&tg.poisonDps?tg.poisonDps:0,base*0.15)}
 let arm=tg.def.arm;if(tg.def.tr.includes('Infanteria')){const t=tier(tg.side,'Infanteria');arm+=t===2?4:t===1?2:0}
 if(!tg.def.fly&&terrAt(tg)===3)arm-=3;
 if(tg.insp>S.time)arm+=2;
 if(tg.sunderT>S.time)arm-=3;
 if(att.def.pierce)arm=0;
 d=Math.max(1,d-Math.max(0,arm));

 tg.flash=0.1;
 if(att.def.lifesteal&&att.alive)att.hp=Math.min(att.max,att.hp+d*att.def.lifesteal);
 if(!ranged&&tg.def.thorns&&att.alive&&!att.def.explode){att.hp-=d*tg.def.thorns;att.flash=0.1;if(att.hp<=0)kill(att,tg)}

 S.time+=dt;
 const alive=S.units.filter(u=>u.alive);
 for(let i=alive.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=alive[i];alive[i]=alive[j];alive[j]=t}
 abilities(alive,dt);
 for(const u of alive){

  if(u.def.regen)u.hp=Math.min(u.max,u.hp+u.max*u.def.regen*dt);

  if(u.def.tr.includes('Silvano')){const t=tier(u.side,'Silvano');if((t>=1&&terrAt(u)===2)||t>=2)u.hp=Math.min(u.max,u.hp+u.max*0.03*dt)}
  if(u.ret<=0||!u.tgt||!u.tgt.alive||hiddenFrom(u.tgt,u)){u.tgt=pickTarget(u);u.ret=0.4+Math.random()*0.2;if(u.def.rng>1&&!u.def.heal&&!u.hold&&!(u.seekCD>S.time))seekHill(u)}

  }

  const blocked=u.def.rng<=1&&!u.def.fly&&!tg.def.fly&&d<=reach&&!lineClear(u.x,u.y,tg.x,tg.y);
  if(d<=reach&&!blocked){u.idle=0;u.moving=false;u.face=Math.sign(tg.x-u.x)||u.face;if(u.cd<=0){attack(u,tg);u.cd=cool(u)}}

 if(!t||!inZone(t,S.side))return;const k=t.c+','+t.r;if(k===lastPaint)return;lastPaint=k;
 const a=S.armies[S.side],idx=a.units.findIndex(u=>u.c===t.c&&u.r===t.r);
 if(paint==='del'){if(idx>=0){a.units.splice(idx,1);renderPanel()}return}
 if(idx>=0)return;
 if(!S.sel){toast('Primero elige una tropa en el panel.');return}
 const def=UBY[S.sel];
 if(a.units.length>=MAXU){toast('Límite de '+MAXU+' grupos.');return}
 if(def.elite&&a.units.filter(u=>UBY[u.id].elite).length>=ELITEMAX){toast('Máximo '+ELITEMAX+' élites por ejército.');return}
 if(armyCost(a)+def.cost>capFor(S.side)){toast('No queda capacidad: '+def.name+' cuesta '+def.cost+'.');return}
 a.units.push({id:def.id,c:t.c,r:t.r});renderPanel();
}
cv.addEventListener('pointerdown',e=>{
 if(S.state!=='deploy'||e.button!==0)return;const t=tileOf(e);if(!t)return;
 if(!inZone(t,S.side)){toast('Solo puedes desplegar en tu franja.');return}
 const a=S.armies[S.side];paint=a.units.some(u=>u.c===t.c&&u.r===t.r)?'del':'add';lastPaint=null;applyPaint(t);
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 e.preventDefault();
});
cv.addEventListener('pointermove',e=>{if(CAM.pinch)return;const t=tileOf(e);const ch=!S.hover||!t||t.c!==S.hover.c||t.r!==S.hover.r;S.hover=t;if(ch)updateTileInfo();if(paint)applyPaint(t)});
const endPaint=()=>{paint=null;lastPaint=null};
cv.addEventListener('pointerup',endPaint);cv.addEventListener('pointercancel',endPaint);
cv.addEventListener('pointerleave',()=>{if(!paint){S.hover=null;updateTileInfo()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

'use strict';
/* ================= CÁMARA: zoom y desplazamiento ================= */
// S.cam.z: 1 = vista general (todo el mapa), hasta ZMAX = vista cercana. x,y: esquina superior izquierda en píxeles del mundo.
const ZMAX=3.5;
S.cam={z:1,x:0,y:0};
function clampCam(){const c=S.cam;c.z=clamp(c.z,1,ZMAX);c.x=clamp(c.x,0,W-W/c.z);c.y=clamp(c.y,0,H-H/c.z)}
// acerca o aleja manteniendo fijo el punto (sx,sy) de la pantalla (en píxeles del canvas)
function zoomAt(f,sx,sy){const c=S.cam,wx=c.x+sx/c.z,wy=c.y+sy/c.z;c.z=clamp(c.z*f,1,ZMAX);c.x=wx-sx/c.z;c.y=wy-sy/c.z;clampCam();updZoomUI()}
function centerOn(wx,wy){const c=S.cam;c.x=wx-W/c.z/2;c.y=wy-H/c.z/2;clampCam()}
function resetCam(){S.cam.z=1;S.cam.x=0;S.cam.y=0;updZoomUI()}
const scr=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
const toWorld=p=>({x:S.cam.x+p.x/S.cam.z,y:S.cam.y+p.y/S.cam.z});
// minimapa (solo con zoom): esquina superior derecha
const MM={w:Math.round(W/6),h:Math.round(H/6),pad:10};
const mmRect=()=>({x:W-MM.w-MM.pad,y:MM.pad,w:MM.w,h:MM.h});
function drawMinimap(){
 if(S.cam.z<=1.02)return;const r=mmRect();
 ctx.fillStyle='#120c14';ctx.fillRect(r.x-3,r.y-3,r.w+6,r.h+6);ctx.drawImage(terrCv,r.x,r.y,r.w,r.h);
 const sx=r.w/W,sy=r.h/H;
 if(S.state==='battle'||S.state==='result'){for(const u of S.units)if(u.alive){ctx.fillStyle=u.side?'#ff6a4f':'#4aa3ff';ctx.fillRect(Math.round(r.x+u.x*T*sx)-1,Math.round(r.y+u.y*T*sy)-1,u.def.big?4:2,u.def.big?4:2)}}
 else for(const side of [0,1]){if(S.mode==='ai'&&side===1)continue;if(S.mode==='pvp'&&side!==S.side&&S.state!=='setup')continue;for(const it of S.armies[side].units){ctx.fillStyle=side?'#ff6a4f':'#4aa3ff';ctx.fillRect(Math.round(r.x+(it.c+0.5)*T*sx)-1,Math.round(r.y+(it.r+0.5)*T*sy)-1,3,3)}}
 const c=S.cam;ctx.strokeStyle='#ffe9b0';ctx.lineWidth=2;ctx.strokeRect(r.x+c.x*sx,r.y+c.y*sy,W/c.z*sx,H/c.z*sy);
}
function inMinimap(p){if(S.cam.z<=1.02)return false;const r=mmRect();return p.x>=r.x&&p.y>=r.y&&p.x<=r.x+r.w&&p.y<=r.y+r.h}
function minimapJump(p){const r=mmRect();centerOn((p.x-r.x)/r.w*W,(p.y-r.y)/r.h*H)}
function updZoomUI(){const b=$('z-fit');if(b)b.disabled=S.cam.z<=1.02;const l=$('z-lvl');if(l)l.textContent='x'+S.cam.z.toFixed(1).replace('.',',')}

// --- entrada ---
const CAM={ptrs:new Map(),pan:null,pinch:null};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0016)),scr(e).x,scr(e).y)},{passive:false});
// fase de captura: se ejecuta antes que el pintado de tropas de ui.js
cv.addEventListener('pointerdown',e=>{
 const p=scr(e);CAM.ptrs.set(e.pointerId,p);
 if(CAM.ptrs.size===2){endPaint();const [a,b]=[...CAM.ptrs.values()];CAM.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};CAM.pan=null;e.stopImmediatePropagation();return}
 if(e.button===0&&inMinimap(p)){CAM.mm=true;minimapJump(p);e.stopImmediatePropagation();try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
 // en el despliegue el botón izquierdo coloca tropas; se mueve con el derecho/central o con dos dedos
 if(e.button===1||e.button===2||(S.state!=='deploy'&&e.button===0)){CAM.pan={x:p.x,y:p.y,cx:S.cam.x,cy:S.cam.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.stopImmediatePropagation();e.preventDefault()}
},true);
cv.addEventListener('pointermove',e=>{
 if(!CAM.ptrs.has(e.pointerId))return;const p=scr(e);CAM.ptrs.set(e.pointerId,p);
 if(CAM.mm){minimapJump(p);return}
 if(CAM.pinch&&CAM.ptrs.size>=2){const [a,b]=[...CAM.ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  S.cam.x-=(m.x-CAM.pinch.m.x)/S.cam.z;S.cam.y-=(m.y-CAM.pinch.m.y)/S.cam.z;clampCam();if(CAM.pinch.d>8)zoomAt(d/CAM.pinch.d,m.x,m.y);CAM.pinch={d,m};return}
 if(CAM.pan){S.cam.x=CAM.pan.cx-(p.x-CAM.pan.x)/S.cam.z;S.cam.y=CAM.pan.cy-(p.y-CAM.pan.y)/S.cam.z;clampCam()}
},true);
const camUp=e=>{CAM.ptrs.delete(e.pointerId);if(CAM.ptrs.size<2)CAM.pinch=null;if(!CAM.ptrs.size){CAM.pan=null;CAM.mm=false}};
cv.addEventListener('pointerup',camUp,true);cv.addEventListener('pointercancel',camUp,true);
window.addEventListener('keydown',e=>{
 if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName))return;
 const k=e.key,st=120/S.cam.z;if(k.startsWith('Arrow')&&S.cam.z<=1.02)return;
 if(k==='+'||k==='='){zoomAt(1.25,W/2,H/2)}else if(k==='-'||k==='_'){zoomAt(0.8,W/2,H/2)}else if(k==='0'){resetCam()}
 else if(k==='ArrowLeft'||k==='a'){S.cam.x-=st;clampCam()}else if(k==='ArrowRight'||k==='d'){S.cam.x+=st;clampCam()}
 else if(k==='ArrowUp'||k==='w'){S.cam.y-=st;clampCam()}else if(k==='ArrowDown'||k==='s'){S.cam.y+=st;clampCam()}else return;
 e.preventDefault();
});
$('z-in').onclick=()=>zoomAt(1.5,W/2,H/2);
$('z-out').onclick=()=>zoomAt(1/1.5,W/2,H/2);
$('z-fit').onclick=resetCam;
updZoomUI();

'use strict';
/* ================= ARRANQUE ================= */
buildSprites();
for(const u of UNITS)ICON[u.id]=iconURL(u.id);
S.armies[1].fac=1;
newField();renderPanel();renderHud();updateTileInfo();
requestAnimationFrame(frame);
window.__altozano=S;window.__alt={step,startBattle,autoArmy,newField,FACTIONS};
})();
</script>
