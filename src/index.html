<div class="game" id="game">
  <div class="canvas-wrap" id="wrap">
    <canvas id="cv" width="1408" height="832" aria-label="Campo de batalla"></canvas>
    <div class="zoombar" role="group" aria-label="Zoom"><button id="z-in" aria-label="Acercar">+</button><span id="z-lvl">x1</span><button id="z-out" aria-label="Alejar">−</button><button id="z-fit">Vista general</button></div>
  </div>
  <header class="top">
    <div class="brand"><h1>Altozano</h1><span>prototipo 1.0</span></div>
    <div class="fieldtag" id="fieldtag"></div>
    <div class="hud" id="hud"></div>
  </header>
  <aside class="win" id="win" aria-labelledby="win-title">
    <div class="win-head" id="win-head"><span class="grip" aria-hidden="true">⋮⋮</span><h2 id="win-title">Campo</h2><button id="win-min" aria-label="Plegar ventana" aria-expanded="true">−</button></div>
    <div class="panel" id="panel"></div>
  </aside>
  <div class="tileinfo" id="tileinfo"></div>
  <div class="overlay" id="overlay" hidden></div>
</div>
